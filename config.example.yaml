server:
  host: 127.0.0.1
  port: 8000

auth:
  enabled: false
  api_keys: []

routing:
  model_fallbacks: {}

usage_log:
  backend: sqlite
  sqlite_path: logs/proxy_usage.sqlite3

# provider 默认超时字段：connect_timeout: 10, request_timeout: 60
# 流式保护默认关闭：stream_idle_timeout: 0, stream_max_duration: 0
providers: []
