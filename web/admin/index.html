<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RouteHub 管理控制台</title>
  <link rel="stylesheet" href="/admin/assets/app.css">
</head>
<body>
  <main id="login-view" class="login-view">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div>
          <h1 id="login-title">RouteHub</h1>
          <p>管理控制台</p>
        </div>
      </div>
      <form id="login-form" autocomplete="off">
        <label for="admin-key">管理员密钥</label>
        <div class="key-field">
          <input
            id="admin-key"
            name="admin_key"
            type="password"
            placeholder="输入 auth.admin_key"
            required
            spellcheck="false"
            autocomplete="off"
          >
          <button id="toggle-key" class="icon-button" type="button" title="显示管理员密钥" aria-label="显示管理员密钥">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.1 12s3.6-6 9.9-6 9.9 6 9.9 6-3.6 6-9.9 6-9.9-6-9.9-6Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="primary-button" type="submit">登录</button>
      </form>
    </section>
  </main>

  <main id="dashboard-view" class="dashboard-view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand compact">
          <div class="brand-mark" aria-hidden="true">R</div>
          <div>
            <h1>RouteHub</h1>
            <p>管理控制台</p>
          </div>
        </div>
        <div class="account-actions">
          <div class="connection-copy">
            <strong id="admin-name">管理员</strong>
            <span id="connection-status">实时连接</span>
          </div>
          <button id="refresh-button" class="icon-button outlined" type="button" title="刷新数据" aria-label="刷新数据">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
            </svg>
          </button>
          <button id="logout-button" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            </svg>
            退出
          </button>
        </div>
      </div>
    </header>

    <div class="page">
      <section class="metric-strip" aria-label="网关概览">
        <div class="metric">
          <span>总请求</span>
          <strong id="metric-requests">0</strong>
        </div>
        <div class="metric">
          <span>成功</span>
          <strong id="metric-success" class="good">0</strong>
        </div>
        <div class="metric">
          <span>失败</span>
          <strong id="metric-errors" class="danger">0</strong>
        </div>
        <div class="metric">
          <span>运行中</span>
          <strong id="metric-running" class="accent">0</strong>
        </div>
        <div class="metric">
          <span>总 Token</span>
          <strong id="metric-tokens">0</strong>
        </div>
        <div class="metric">
          <span>平均用时</span>
          <strong id="metric-latency">-</strong>
        </div>
      </section>

      <nav class="view-tabs" aria-label="管理视图">
        <button class="tab-button active" type="button" data-view="overview">概览</button>
        <button class="tab-button" type="button" data-view="logs">请求日志</button>
      </nav>

      <section id="overview-view" class="view-panel">
        <div class="section-heading">
          <div>
            <h2>渠道状态</h2>
            <p id="provider-count">0 个渠道</p>
          </div>
        </div>
        <div class="table-shell">
          <table class="provider-table">
            <thead>
              <tr>
                <th>状态</th>
                <th>渠道</th>
                <th>类型</th>
                <th>P / W</th>
                <th>模型</th>
                <th>请求</th>
                <th>成功率</th>
                <th>Token</th>
                <th>最近请求</th>
              </tr>
            </thead>
            <tbody id="provider-rows"></tbody>
          </table>
          <div id="provider-empty" class="empty-state">暂无渠道配置</div>
        </div>

        <div class="section-heading spaced">
          <div>
            <h2>API Key</h2>
            <p id="api-key-count">0 个 API Key</p>
          </div>
        </div>
        <div class="table-shell">
          <table class="key-table">
            <thead>
              <tr>
                <th>状态</th>
                <th>名称</th>
                <th>并发</th>
                <th>允许模型</th>
                <th>请求</th>
                <th>今日 / 上限</th>
                <th>成功率</th>
                <th>Token</th>
                <th>最近请求</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="api-key-rows"></tbody>
          </table>
          <div id="api-key-empty" class="empty-state">暂无 API Key</div>
        </div>
      </section>

      <section id="logs-view" class="view-panel" hidden>
        <div class="section-heading">
          <div>
            <h2>请求日志</h2>
            <p id="log-count">共 0 条</p>
          </div>
        </div>
        <div class="table-shell">
          <table class="log-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>状态</th>
                <th>API Key</th>
                <th>接口</th>
                <th>渠道</th>
                <th>模型</th>
                <th>Token</th>
                <th>用时 / 首字</th>
                <th>错误</th>
              </tr>
            </thead>
            <tbody id="log-rows"></tbody>
          </table>
          <div id="log-empty" class="empty-state">暂无请求日志</div>
        </div>
        <nav class="pagination" aria-label="日志分页">
          <button id="previous-page" class="secondary-button" type="button">上一页</button>
          <span id="page-status">第 1 / 1 页</span>
          <button id="next-page" class="secondary-button" type="button">下一页</button>
        </nav>
      </section>
    </div>
  </main>

  <script src="/admin/assets/app.js" defer></script>
</body>
</html>
