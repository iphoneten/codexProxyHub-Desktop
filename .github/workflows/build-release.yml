name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RECODEX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.build_time.outputs.value }}
    steps:
      - name: Generate build time
        id: build_time
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: macos-14
    env:
      RECODEX_BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            target: aarch64-apple-darwin
            artifact: recodexProxyHub-macos-arm64
            asset_pattern: recodexProxyHub-v*-macos-arm64-*.dmg
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: recodexProxyHub-macos-x86_64
            asset_pattern: recodexProxyHub-v*-macos-x86_64-*.dmg
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build DMG
        run: ./scripts/build-dmg.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset_pattern }}
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: prepare
    runs-on: windows-latest
    env:
      RECODEX_BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: recodexProxyHub-windows-x86_64
          path: dist/recodexProxyHub-v*-windows-x86_64-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - prepare
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: recodexProxyHub-*
          path: release-assets
          merge-multiple: true
      - name: Verify release packages
        run: |
          test "$(find release-assets -maxdepth 1 -name 'recodexProxyHub-v*-macos-arm64-*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'recodexProxyHub-v*-macos-x86_64-*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'recodexProxyHub-v*-windows-x86_64-*.zip' | wc -l)" -eq 1
          ls -lh release-assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            while IFS= read -r asset; do
              case "$asset" in
                "recodexProxyHub-$GITHUB_REF_NAME-macos-arm64-"*.dmg|\
                "recodexProxyHub-$GITHUB_REF_NAME-macos-x86_64-"*.dmg|\
                "recodexProxyHub-$GITHUB_REF_NAME-windows-x86_64-"*.zip)
                  if [[ ! -f "release-assets/$asset" ]]; then
                    gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                      --yes \
                      --repo "$GITHUB_REPOSITORY"
                  fi
                  ;;
              esac
            done < <(
              gh release view "$GITHUB_REF_NAME" \
                --json assets \
                --jq '.assets[].name' \
                --repo "$GITHUB_REPOSITORY"
            )
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "recodexProxyHub $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
