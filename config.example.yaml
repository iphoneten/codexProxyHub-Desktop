server:
  host: 127.0.0.1
  port: 8000

web:
  enabled: false
  session_ttl_hours: 24

auth:
  enabled: false
  # Admin Web 使用此密钥登录；未配置时 /admin 会拒绝登录。
  admin_key: null
  # 每个 API Key 可配置 daily_token_limit、allowed_models 与 allowed_providers。
  # daily_token_limit 为空或 0 表示不限，按本地自然日累计 input+output token。
  # 两者为空列表或包含 "*" 时表示不限制。
  api_keys: []
  # Auth 账号统一使用的模型列表，账号详情无需单独填写。
  openai_models:
    - gpt-5.4
    - gpt-5.5
    - gpt-5.6-luna
    - gpt-5.6-sol
    - gpt-5.6-terra
  grok_models:
    - grok-4.5

routing:
  model_fallbacks: {}
  # 同一优先级内：provider_first 先渠道，auth_first 先 Auth 账号；不能越过更小的 priority。
  auth_preference: provider_first
  # 统一上游代理。Auth 账号始终使用；普通渠道需设置 use_proxy: true。
  # 留空表示不强制代理。
  # 示例: http://127.0.0.1:7890 或 socks5h://127.0.0.1:7890
  auth_proxy: ""

usage_log:
  backend: sqlite
  sqlite_path: logs/proxy_usage.sqlite3

# provider 默认超时/重试字段：connect_timeout: 10, request_timeout: 60, max_retries: 3
# max_retries 是每轮总尝试次数（包含首次），0 按 1 次；全渠道失败后继续下一轮，成功或取消后结束。
# persistent_retry 仅保留旧配置兼容；业务请求不再使用熔断/冷却/半开准入限制。
# 普通渠道默认直连；设置 use_proxy: true 后使用 routing.auth_proxy。
# 流式保护默认关闭：stream_idle_timeout: 0, stream_max_duration: 0
# 原始 SSE 抓取默认关闭。排查渠道流式收尾问题时可在单个 provider 上开启：
# debug_capture_sse: true
# debug_sse_path: logs/raw_sse
# debug_sse_max_events: 120
# Google AI Studio 原生 API 示例：
# - name: google-ai
#   enabled: true
#   provider_type: google_ai_studio
#   base_url: https://generativelanguage.googleapis.com/v1beta
#   api_key: YOUR_GOOGLE_AI_STUDIO_KEY
#   models: [gemini-2.5-pro, gemini-2.5-flash]
#   capabilities:
#     supports_chat: true
#     supports_responses: false
#   responses_mode: chat
# anthropic 类型渠道同时承接两种入站协议：
#   - OpenAI 兼容接口（/v1/chat/completions 等）：翻译成 /messages 再发给上游
#   - 原生 Anthropic 接口（/v1/messages）：请求与响应原样直通，供 Claude Code / Anthropic SDK 接入
# 入站 /v1/messages 只会选中 provider_type: anthropic 的渠道。
# Anthropic Bearer 认证示例（默认使用 x-api-key）：
# - name: anthropic-bearer
#   enabled: true
#   provider_type: anthropic
#   base_url: https://example.com/v1
#   api_key: YOUR_ANTHROPIC_TOKEN
#   models: [claude-sonnet-4-5]
#   extra_headers:
#     Authorization: Bearer {api_key}
#   responses_mode: chat
providers: []
