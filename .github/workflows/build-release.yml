name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RECODEX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            target: aarch64-apple-darwin
            artifact: recodexProxyHub-macos-arm64
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: recodexProxyHub-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build DMG
        run: ./scripts/build-dmg.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: recodexProxyHub-windows-x86_64
          path: dist/recodexProxyHub-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: recodexProxyHub-*
          path: release-assets
          merge-multiple: true
      - name: Verify release packages
        run: |
          test -f release-assets/recodexProxyHub-macos-arm64.dmg
          test -f release-assets/recodexProxyHub-macos-x86_64.dmg
          test -f release-assets/recodexProxyHub-windows-x86_64.zip
          ls -lh release-assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "recodexProxyHub $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
