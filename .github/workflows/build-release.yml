name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RECODEX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            target: aarch64-apple-darwin
            artifact: recodexProxyHub-macos-arm64
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: recodexProxyHub-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build DMG
        run: ./scripts/build-dmg.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: recodexProxyHub-windows-x86_64
          path: dist/recodexProxyHub-windows-x86_64.zip
          if-no-files-found: error
